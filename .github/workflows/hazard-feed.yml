name: hazard-feed
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hazard-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and push alerts.json
        env:
          GITHUB_ALERTS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_alerts.py --push || (sleep 30 && python scripts/build_alerts.py --push)
